@if (planet(); as planet) {
  <section class="planet-page" aria-labelledby="planet-name">
    <app-reload-banner />
    <div class="bar">
      <h2 id="planet-name">{{ planet.name }}</h2>
      <app-save-indicator />
      <div class="row">
        <button
          type="button"
          class="secondary"
          aria-controls="catalogue-panel"
          [attr.aria-expanded]="panel() === 'catalogue'"
          (click)="toggle('catalogue')"
        >
          Catalogue
        </button>
        <button
          type="button"
          class="secondary"
          aria-controls="settings-panel"
          [attr.aria-expanded]="panel() === 'settings'"
          (click)="toggle('settings')"
        >
          Settings
        </button>
      </div>
    </div>
    <div class="stage">
      <app-planet-view [name]="planet.name" [radiusLevel]="planet.radiusLevel" />
      <!-- Straight after the canvas, so Tab goes from the planet to the clouds and the sun. -->
      <app-sky-list />
      <app-placement-hud />
      <app-inventory-panel />
      <app-receipt-toast />
      <app-celebration />
      <app-info-card />
      <!-- The journal page (JRN-01) goes above the welcome-back summary in this column. -->
      <div class="return">
        <app-welcome-back />
      </div>
      @if (!sceneReady()) {
        <app-loading />
      }
      @switch (panel()) {
        @case ('settings') {
          <app-settings-panel id="settings-panel" [planet]="planet" />
        }
        @case ('catalogue') {
          <app-catalogue id="catalogue-panel" (closed)="panel.set(null)" />
        }
      }
      <!-- Last, so a reward shows over everything else on the planet. -->
      <app-reward-reveal />
    </div>
  </section>
} @else if (loadFailed()) {
  <div class="status" role="alert">
    <p>We couldn't reach your planet just now. It is safe and sound, so let's try again.</p>
    <button type="button" (click)="load()">Try again</button>
  </div>
} @else {
  <app-loading class="opening" />
}
