@if (menu(); as menu) {
  <div
    #box
    class="menu"
    role="group"
    [attr.aria-label]="title()"
    [style.left.px]="position().x"
    [style.top.px]="position().y"
  >
    <p class="title">{{ title() }}</p>
    @if (menu.kind === 'plant') {
      <button type="button" (click)="digUp(menu.id)">Dig up</button>
    } @else {
      <button type="button" (click)="move(menu.id)">Move</button>
      <button type="button" class="secondary" (click)="putAway(menu.id)">Put away</button>
    }
  </div>
}
