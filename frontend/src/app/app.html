<main class="shell" [class.planet]="view() === 'planet'">
  <h1>Pocket Planet Gardener</h1>
  @switch (view()) {
    @case ('create-planet') {
      <app-create-planet />
    }
    @case ('planet') {
      <app-planet-page />
    }
    @case ('admin') {
      <!-- Only the game owner opens it, so players never download it (NFR-03). -->
      @defer (on immediate) {
        <app-admin />
      }
    }
  }
</main>
