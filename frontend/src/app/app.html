<main class="shell" [class.planet]="view() === 'planet'">
  <h1>Pocket Planet Gardener</h1>
  @switch (view()) {
    @case ('create-planet') {
      <app-create-planet />
    }
    @case ('planet') {
      <app-planet-page />
    }
    @case ('admin') {
      <section class="admin">Admin tools come later</section>
    }
  }
</main>
